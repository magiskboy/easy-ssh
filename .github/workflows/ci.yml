name: Build

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # Ubuntu 24.04 system Qt is 6.4.x; app + QTermWidget need >= 6.6.
  QT_VERSION: "6.8.3"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          python3 -m pip install --user "clang-format==22.1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          chmod +x .github/scripts/run-clang-format-check.sh
          .github/scripts/run-clang-format-check.sh

  build:
    name: ${{ matrix.target }}
    needs: [format]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            os_family: linux
            qt_host: linux
            qt_arch: linux_gcc_64

          - runner: ubuntu-24.04-arm
            target: linux-arm64
            os_family: linux
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64

          - runner: macos-15
            target: macos-arm64
            os_family: macos

          - runner: macos-15-intel
            target: macos-amd64
            os_family: macos

          - runner: windows-2022
            target: windows-amd64
            os_family: windows
            qt_host: windows
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        if: matrix.os_family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux build tools
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            libssh-dev \
            libsecret-1-dev \
            libglib2.0-dev

      - name: Install Qt (Linux / Windows via aqt)
        if: matrix.os_family == 'linux' || matrix.os_family == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          install-deps: "true"
          cache: true
          cache-key-prefix: install-qt-${{ matrix.target }}
          setup-python: true
          set-env: true

      - name: Install macOS packages
        if: matrix.os_family == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config qt libssh qtkeychain
          {
            echo "CMAKE_PREFIX_PATH=$(brew --prefix qt):$(brew --prefix qtkeychain):$(brew --prefix libssh)"
          } >> "$GITHUB_ENV"
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Cache vcpkg libssh
        if: matrix.os_family == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            .deps/vcpkg/installed
            .deps/vcpkg/packages
            .deps/vcpkg/downloads
          key: vcpkg-libssh-x64-windows-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Enigma Virtual Box
        if: matrix.os_family == 'windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/enigmavb_en.exe" \
            "https://enigmaprotector.com/assets/files/enigmavb_en.exe"
          "$RUNNER_TEMP/enigmavb_en.exe" /VERYSILENT /SUPPRESSMSGBOXES \
            /DIR="C:/Program Files/Enigma Virtual Box"
          echo "ENIGMA_VB_DIR=C:/Program Files/Enigma Virtual Box" >> "$GITHUB_ENV"

      - name: Install libssh (vcpkg)
        if: matrix.os_family == 'windows'
        run: |
          set -euo pipefail
          VCPKG_ROOT="${GITHUB_WORKSPACE}/.deps/vcpkg"
          if [[ ! -x "${VCPKG_ROOT}/vcpkg.exe" && ! -x "${VCPKG_ROOT}/vcpkg" ]]; then
            if [[ -d "${VCPKG_ROOT}" && ! -d "${VCPKG_ROOT}/.git" ]]; then
              # Cache restored partial contents without the git repo; clone into a
              # temp dir and move the .git tree in so cached installed/ is preserved.
              tmp="$(mktemp -d)"
              git clone --depth 1 https://github.com/microsoft/vcpkg.git "$tmp"
              cp -r "$tmp/.git" "${VCPKG_ROOT}/.git"
              cp -n "$tmp"/* "${VCPKG_ROOT}/" 2>/dev/null || true
              cp -rn "$tmp"/scripts "${VCPKG_ROOT}/" 2>/dev/null || true
              rm -rf "$tmp"
            else
              git clone --depth 1 https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
            fi
            "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          fi
          "${VCPKG_ROOT}/vcpkg" install libssh:x64-windows --disable-metrics
          {
            echo "VCPKG_ROOT=${VCPKG_ROOT}"
            echo "CMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
            echo "VCPKG_TARGET_TRIPLET=x64-windows"
          } >> "$GITHUB_ENV"
          echo "${VCPKG_ROOT}/installed/x64-windows/bin" >> "$GITHUB_PATH"
          # Also expose for DLL bundling / find_package fallbacks.
          echo "CMAKE_PREFIX_PATH=${VCPKG_ROOT}/installed/x64-windows${CMAKE_PREFIX_PATH:+;${CMAKE_PREFIX_PATH}}" >> "$GITHUB_ENV"

      - name: Build QTermWidget (and QtKeychain on Linux/Windows)
        env:
          PREFIX: ${{ github.workspace }}/.deps/prefix
          BUILD_QTKEYCHAIN: ${{ (matrix.os_family == 'linux' || matrix.os_family == 'windows') && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/build-qtermwidget.sh
          .github/scripts/build-qtermwidget.sh

          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) CMAKE_SEP=';' ;;
            *) CMAKE_SEP=':' ;;
          esac

          # Preserve Qt from install-qt-action (QT_ROOT_DIR) — CMAKE_PREFIX_PATH alone
          # is not always exported into subsequent steps on all runners.
          PREFIX_PATH="${PREFIX}"
          if [[ -n "${QT_ROOT_DIR:-}" ]]; then
            PREFIX_PATH="${PREFIX_PATH}${CMAKE_SEP}${QT_ROOT_DIR}"
          fi
          if [[ -n "${CMAKE_PREFIX_PATH:-}" ]]; then
            PREFIX_PATH="${PREFIX_PATH}${CMAKE_SEP}${CMAKE_PREFIX_PATH}"
          fi

          {
            echo "CMAKE_PREFIX_PATH=${PREFIX_PATH}"
            echo "PREFIX=${PREFIX}"
            echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig:${PREFIX}/lib64/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
            echo "LD_LIBRARY_PATH=${PREFIX}/lib:${PREFIX}/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
            echo "DYLD_FALLBACK_LIBRARY_PATH=${PREFIX}/lib${DYLD_FALLBACK_LIBRARY_PATH:+:${DYLD_FALLBACK_LIBRARY_PATH}}"
          } >> "$GITHUB_ENV"
          echo "${PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]]; then
            EXTRA_ARGS+=(
              "-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}"
              "-DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET:-x64-windows}"
            )
          fi
          cmake -S . -B build-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"}

      - name: Build
        run: cmake --build build-release --parallel

      - name: Package (Linux)
        if: matrix.os_family == 'linux'
        run: |
          chmod +x .github/scripts/package-linux.sh
          .github/scripts/package-linux.sh "${{ matrix.target }}" build-release dist

      - name: Package (macOS)
        if: matrix.os_family == 'macos'
        run: |
          chmod +x .github/scripts/package-macos.sh
          .github/scripts/package-macos.sh "${{ matrix.target }}" build-release dist

      - name: Package (Windows)
        if: matrix.os_family == 'windows'
        shell: cmd
        run: .github\scripts\package-windows.bat "${{ matrix.target }}" build-release dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-ssh-${{ matrix.target }}
          path: dist/easy-ssh-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: easy-ssh-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
