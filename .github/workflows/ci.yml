name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pip toolchains
        run: |
          chmod +x .github/scripts/install-pip-toolchains.sh
          bin="$(.github/scripts/install-pip-toolchains.sh)"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          chmod +x .github/scripts/run-clang-format-check.sh
          .github/scripts/run-clang-format-check.sh

  build:
    name: ${{ matrix.target }}
    needs: [format]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            os_family: linux

          - runner: ubuntu-24.04-arm
            target: linux-arm64
            os_family: linux

          - runner: macos-15
            target: macos-arm64
            os_family: macos

          - runner: macos-15-intel
            target: macos-amd64
            os_family: macos

          - runner: windows-2022
            target: windows-amd64
            os_family: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        if: matrix.os_family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows build tools
        if: matrix.os_family == 'windows'
        shell: bash
        run: |
          chmod +x .github/scripts/install-pip-toolchains.sh
          bin="$(.github/scripts/install-pip-toolchains.sh)"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install Linux build tools
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update
          # System libs / compiler — not available via pip (see ci/apt-linux.txt).
          # cmake/ninja/patchelf come from requirements.txt via venv.
          mapfile -t pkgs < <(grep -vE '^\s*(#|$)' ci/apt-linux.txt)
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          chmod +x .github/scripts/install-pip-toolchains.sh
          bin="$(.github/scripts/install-pip-toolchains.sh)"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install Linux AppImage tool
        if: matrix.os_family == 'linux'
        run: |
          set -euo pipefail
          chmod +x .github/scripts/fetch-appimagetool.sh
          tool="$(.github/scripts/fetch-appimagetool.sh "${GITHUB_WORKSPACE}/.deps/tools")"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"

      - name: Install macOS build tools
        if: matrix.os_family == 'macos'
        run: |
          brew update
          # cmake/ninja come from requirements.txt (venv), not brew.
          # Use a venv — Homebrew Python is PEP 668 externally-managed.
          brew install pkg-config
          chmod +x .github/scripts/install-pip-toolchains.sh
          bin="$(.github/scripts/install-pip-toolchains.sh)"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .deps/qt
            .deps/tools
            .deps/venv
            build-release/_deps
          key: easy-ssh-deps-${{ matrix.target }}-${{ hashFiles('cmake/EasySshVersions.cmake', 'requirements.txt', 'ci/apt-linux.txt', '.github/scripts/fetch-appimagetool.sh', '.github/scripts/install-pip-toolchains.sh', 'third_party/qtermwidget-patches/**') }}

      - name: Configure
        run: |
          set -euo pipefail
          cmake --preset release \
            -DEASY_SSH_PACKAGE_SUFFIX="${{ matrix.target }}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/staging"

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Install and package
        run: |
          set -euo pipefail
          staging="${{ github.workspace }}/staging"
          cmake --install build-release --prefix "$staging"
          mkdir -p dist
          cd build-release
          case "${{ matrix.os_family }}" in
            linux)
              # appimagetool is itself an AppImage; extract without FUSE on runners.
              export APPIMAGE_EXTRACT_AND_RUN=1
              cpack -C Release -G "DEB;RPM;TGZ;AppImage"
              ;;
            macos)
              # DragNDrop + hdiutil detach can flake on hosted runners; retry.
              ok=0
              for attempt in 1 2 3; do
                if cpack -C Release -G DragNDrop; then
                  ok=1
                  break
                fi
                echo "cpack DragNDrop failed (attempt ${attempt}); retrying…" >&2
                sleep 5
                # Best-effort cleanup of leftover volume mounts.
                hdiutil info 2>/dev/null | awk -F': ' '/\/Volumes\/EasySSH/ {print $NF}' \
                  | while read -r mp; do hdiutil detach "$mp" -force 2>/dev/null || true; done
              done
              [[ "$ok" -eq 1 ]] || exit 1
              ;;
            windows)
              if ! cpack -C Release -G NSIS; then
                nsis_log="_CPack_Packages/win64/NSIS/NSISOutput.log"
                if [[ -f "$nsis_log" ]]; then
                  echo "::group::NSISOutput.log"
                  cat "$nsis_log"
                  echo "::endgroup::"
                else
                  echo "NSISOutput.log not found at $nsis_log" >&2
                  find _CPack_Packages -name 'NSISOutput.log' -print -exec cat {} \; 2>/dev/null || true
                fi
                exit 1
              fi
              ;;
          esac
          shopt -s nullglob
          mv easy-ssh-* ../dist/ 2>/dev/null || true
          mv *.deb *.rpm *.tar.gz *.AppImage *.dmg *.exe ../dist/ 2>/dev/null || true
          shopt -u nullglob

          ls -lah "${{ github.workspace }}/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-ssh-${{ matrix.target }}
          path: |
            dist/easy-ssh-${{ matrix.target }}.*
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: easy-ssh-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
