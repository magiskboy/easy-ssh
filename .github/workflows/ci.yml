name: Build

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # Ubuntu 24.04 system Qt is 6.4.x; app + QTermWidget need >= 6.6.
  QT_VERSION: "6.8.3"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          python3 -m pip install --user "clang-format==22.1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          chmod +x .github/scripts/run-clang-format-check.sh
          .github/scripts/run-clang-format-check.sh

  build:
    name: ${{ matrix.target }}
    needs: [format]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            os_family: linux
            qt_host: linux
            qt_arch: linux_gcc_64

          - runner: ubuntu-24.04-arm
            target: linux-arm64
            os_family: linux
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64

          - runner: macos-15
            target: macos-arm64
            os_family: macos

          - runner: macos-15-intel
            target: macos-amd64
            os_family: macos

          # Windows skipped until a ConPTY-backed terminal replaces QTermWidget.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build tools
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            libssh-dev \
            libsecret-1-dev \
            libglib2.0-dev

      - name: Install Qt (Linux via aqt)
        if: matrix.os_family == 'linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          install-deps: "true"
          cache: true
          cache-key-prefix: install-qt-${{ matrix.target }}
          setup-python: true
          set-env: true

      - name: Install macOS packages
        if: matrix.os_family == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config qt libssh qtkeychain
          {
            echo "CMAKE_PREFIX_PATH=$(brew --prefix qt):$(brew --prefix qtkeychain):$(brew --prefix libssh)"
          } >> "$GITHUB_ENV"
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Build QTermWidget (and QtKeychain on Linux)
        env:
          PREFIX: ${{ github.workspace }}/.deps/prefix
          BUILD_QTKEYCHAIN: ${{ matrix.os_family == 'linux' && '1' || '0' }}
        run: |
          chmod +x .github/scripts/build-qtermwidget.sh
          .github/scripts/build-qtermwidget.sh
          {
            echo "CMAKE_PREFIX_PATH=${PREFIX}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
            echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig:${PREFIX}/lib64/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "LD_LIBRARY_PATH=${PREFIX}/lib:${PREFIX}/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            echo "DYLD_FALLBACK_LIBRARY_PATH=${PREFIX}/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        run: cmake --build build-release --parallel

      - name: Package
        run: |
          chmod +x .github/scripts/package.sh
          .github/scripts/package.sh "${{ matrix.target }}" build-release dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-ssh-${{ matrix.target }}
          path: dist/easy-ssh-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: easy-ssh-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
