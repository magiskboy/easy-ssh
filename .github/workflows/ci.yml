name: Build

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          python3 -m pip install --user "clang-format==22.1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          chmod +x .github/scripts/run-clang-format-check.sh
          .github/scripts/run-clang-format-check.sh

  build:
    name: ${{ matrix.target }}
    needs: [format]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            os_family: linux

          - runner: ubuntu-24.04-arm
            target: linux-arm64
            os_family: linux

          - runner: macos-15
            target: macos-arm64
            os_family: macos

          - runner: macos-15-intel
            target: macos-amd64
            os_family: macos

          - runner: windows-2022
            target: windows-amd64
            os_family: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        if: matrix.os_family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows build tools
        if: matrix.os_family == 'windows'
        shell: bash
        run: |
          python -m pip install --user "aqtinstall>=3.1.0"

      - name: Install Linux build tools
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            python3-pip \
            patchelf \
            rpm \
            libssl-dev \
            zlib1g-dev \
            libsecret-1-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libgstreamer-gl1.0-0 \
            libpulse-dev \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb1 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-xkb-dev \
            libxcb-cursor0
          python3 -m pip install --user "aqtinstall>=3.1.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Linux AppImage tool
        if: matrix.os_family == 'linux'
        run: |
          set -euo pipefail
          tools_dir="${GITHUB_WORKSPACE}/.deps/tools"
          mkdir -p "$tools_dir"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) aqt_arch="x86_64" ;;
            aarch64|arm64) aqt_arch="aarch64" ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          tool="$tools_dir/appimagetool-${aqt_arch}.AppImage"
          if [[ ! -x "$tool" ]]; then
            curl -fsSL \
              "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${aqt_arch}.AppImage" \
              -o "$tool"
            chmod +x "$tool"
          fi
          echo "${tools_dir}" >> "$GITHUB_PATH"

      - name: Install macOS build tools
        if: matrix.os_family == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config pipx
          pipx install aqtinstall
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .deps/qt
            build-release/_deps
          key: easy-ssh-deps-${{ matrix.target }}-${{ hashFiles('cmake/EasySshVersions.cmake', 'third_party/qtermwidget-patches/**') }}

      - name: Configure
        run: |
          set -euo pipefail
          cmake --preset release \
            -DEASY_SSH_PACKAGE_SUFFIX="${{ matrix.target }}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/staging"

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Install and package
        run: |
          set -euo pipefail
          staging="${{ github.workspace }}/staging"
          cmake --install build-release --prefix "$staging"
          mkdir -p dist
          cd build-release
          case "${{ matrix.os_family }}" in
            linux)
              cpack -C Release -G "DEB;RPM;TGZ"
              ;;
            macos)
              cpack -C Release -G DragNDrop
              ;;
            windows)
              cpack -C Release -G NSIS
              ;;
          esac
          shopt -s nullglob
          mv easy-ssh-* ../dist/ 2>/dev/null || true
          mv *.deb *.rpm *.tar.gz *.dmg *.exe ../dist/ 2>/dev/null || true
          shopt -u nullglob

          if [[ "${{ matrix.os_family }}" == "linux" ]]; then
            arch="$(uname -m)"
            case "$arch" in
              x86_64|amd64) aqt_arch="x86_64" ;;
              aarch64|arm64) aqt_arch="aarch64" ;;
              *) echo "unsupported arch: $arch" >&2; exit 1 ;;
            esac
            chmod +x "${{ github.workspace }}/.github/scripts/build-appimage.sh"
            "${{ github.workspace }}/.github/scripts/build-appimage.sh" \
              "$staging" \
              "${{ github.workspace }}/dist/easy-ssh-${{ matrix.target }}.AppImage" \
              "${{ github.workspace }}/.deps/tools/appimagetool-${aqt_arch}.AppImage" \
              "${{ github.workspace }}/AppDirBuild"
          fi

          ls -lah "${{ github.workspace }}/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-ssh-${{ matrix.target }}
          path: |
            dist/easy-ssh-${{ matrix.target }}.*
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: easy-ssh-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
