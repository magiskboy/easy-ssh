name: Bug report
description: Report a problem with Easy SSH
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Short summary and steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Easy SSH version
      placeholder: "e.g. 1.0.0 or commit hash"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. Fedora 43, Windows 11, macOS 15"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install?
      options:
        - Installer script
        - GitHub Release package
        - Built from source
        - Other
    validations:
      required: true
