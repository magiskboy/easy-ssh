# Auth matrix host — Match blocks restrict methods per user.

PasswordAuthentication yes
KbdInteractiveAuthentication yes
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthenticationMethods any

AllowTcpForwarding yes
AllowAgentForwarding yes
AllowStreamLocalForwarding no
GatewayPorts no
X11Forwarding no

MaxSessions 10
ClientAliveInterval 30
ClientAliveCountMax 3

Subsystem sftp /usr/lib/openssh/sftp-server

# keyonly: public key only
Match User keyonly
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey

# passonly: password only
Match User passonly
    PasswordAuthentication yes
    KbdInteractiveAuthentication no
    PubkeyAuthentication no
    AuthenticationMethods password

# kbdint: prefer keyboard-interactive (still allow password as fallback for lab)
Match User kbdint
    PasswordAuthentication yes
    KbdInteractiveAuthentication yes
    PubkeyAuthentication no
    AuthenticationMethods keyboard-interactive

# keyuser: pubkey preferred (password also works for convenience)
Match User keyuser
    PasswordAuthentication yes
    PubkeyAuthentication yes
