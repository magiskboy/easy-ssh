version = 1

# In-file SPDX headers are applied ONLY to C / C++ / Objective-C / Objective-C++ /
# Swift sources under src/ and tests/ (see .github/scripts/run-reuse.sh annotate).
# All other project files are licensed via the annotations below — do not add
# SPDX headers to them.

# Project-authored docs, build system, tests, scripts, CI / editor metadata
[[annotations]]
path = [
  "README.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "NOTICE",
  "CMakeLists.txt",
  "CMakePresets.json",
  "installer.sh",
  ".gitignore",
  ".editorconfig",
  ".clang-format",
  ".clang-tidy",
  ".clangd",
  ".gitattributes",
  "cmake/**",
  "scripts/**",
  "tests/**",
  "requirements/**",
  ".githooks/**",
  ".github/**",
  ".vscode/**",
  "src/CMakeLists.txt",
  "src/macos/CMakeLists.txt",
  "src/macos/Info.plist.in",
  "src/macos/Package.swift.in",
]
SPDX-FileCopyrightText = "Copyright (C) 2026 Nguyen Khac Thanh <ask@nkthanh.dev>"
SPDX-License-Identifier = "GPL-3.0-only"

# Application icons and desktop integration assets (generated / authored here)
[[annotations]]
path = [
  "icon.png",
  "screenshots/**",
  "resources/**",
]
SPDX-FileCopyrightText = "Copyright (C) 2026 Nguyen Khac Thanh <ask@nkthanh.dev>"
SPDX-License-Identifier = "GPL-3.0-only"

# AppStream metainfo is dedicated to the public domain (matches metadata_license)
[[annotations]]
path = ["resources/linux/*.metainfo.xml"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2026 Nguyen Khac Thanh <ask@nkthanh.dev>"
SPDX-License-Identifier = "CC0-1.0"

# Vendored lxqt/qtermwidget (upstream licenses; Easy SSH mods documented in EASY_SSH.md)
[[annotations]]
path = ["third_party/qtermwidget/**"]
SPDX-FileCopyrightText = "Copyright (C) The QTermWidget / Konsole Authors; Easy SSH modifications Copyright (C) 2026 Nguyen Khac Thanh <ask@nkthanh.dev>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Project notes for the vendored qtermwidget tree
[[annotations]]
path = ["third_party/qtermwidget/EASY_SSH.md"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2026 Nguyen Khac Thanh <ask@nkthanh.dev>"
SPDX-License-Identifier = "GPL-3.0-only"

# Vendored lxqt/lxqt-build-tools (unmodified; see EASY_SSH.md)
[[annotations]]
path = ["third_party/lxqt-build-tools/**"]
SPDX-FileCopyrightText = "Copyright (C) The LXQt Authors"
SPDX-License-Identifier = "BSD-3-Clause"

# Project notes for the vendored lxqt-build-tools tree
[[annotations]]
path = ["third_party/lxqt-build-tools/EASY_SSH.md"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2026 Nguyen Khac Thanh <ask@nkthanh.dev>"
SPDX-License-Identifier = "GPL-3.0-only"

# Qt Advanced Docking System notes (FetchContent; not vendored in-tree)
[[annotations]]
path = ["third_party/qt-ads/**"]
SPDX-FileCopyrightText = [
  "Copyright (C) 2024 Uwe Kindler",
  "Copyright (C) 2026 Nguyen Khac Thanh <ask@nkthanh.dev>",
]
SPDX-License-Identifier = "LGPL-2.1-only"

# Product / phase specs and theme assets authored here
[[annotations]]
path = [".ai/**"]
SPDX-FileCopyrightText = "Copyright (C) 2026 Nguyen Khac Thanh <ask@nkthanh.dev>"
SPDX-License-Identifier = "GPL-3.0-only"
