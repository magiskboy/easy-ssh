# Local integration test stack for easy-ssh (podman-compose / docker compose).
# Target is not published to the host — reachable only via bastion jump from tests.

services:
  ssh-direct:
    build: ./images/ssh-node
    container_name: easy-ssh-it-direct
    environment:
      SSH_PORT: "2222"
      SSH_USERS: "direct:passdirect"
    ports:
      - "127.0.0.1:12222:2222"
    networks:
      - edge

  bastion1:
    build: ./images/ssh-node
    container_name: easy-ssh-it-bastion1
    environment:
      SSH_PORT: "2222"
      SSH_USERS: "jump1:passapp;gateway:passjump1"
    ports:
      - "127.0.0.1:12223:2222"
    networks:
      - edge
      - private

  bastion2:
    build: ./images/ssh-node
    container_name: easy-ssh-it-bastion2
    environment:
      SSH_PORT: "2222"
      SSH_USERS: "jump2:passjump2"
    ports:
      - "127.0.0.1:12224:2222"
    networks:
      - edge
      - private

  ssh-target:
    build: ./images/ssh-node
    container_name: easy-ssh-it-target
    environment:
      SSH_PORT: "22"
      SSH_USERS: "app:passapp"
    networks:
      - private
    depends_on:
      - internal-app

  internal-app:
    image: docker.io/library/nginx:1.27-alpine
    container_name: easy-ssh-it-internal
    networks:
      - private

networks:
  edge:
    name: easy-ssh-it-edge
  private:
    name: easy-ssh-it-private
